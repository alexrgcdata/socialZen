<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SocialZen</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { width: 270px; margin: 0; padding: 18px; color: #1d2433; background: #fffaf0; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .brand img { width: 58px; height: 40px; object-fit: contain; }
    h1 { font-size: 20px; margin: 0; }
    .byline { color: #687080; font-size: 11px; margin-top: 2px; }
    p { font-size: 13px; line-height: 1.45; margin: 10px 0 14px; }
    label.toggle { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border-radius: 12px; background: #fff; border: 1px solid #eadfca; font-weight: 700; }
    input { width: 18px; height: 18px; accent-color: #0c7c70; }
    .status { margin-top: 12px; font-size: 12px; color: #0c7c70; font-weight: 700; }
    a { color: #0c7c70; }
  </style>
</head>
<body>
  <div class="brand">
    <img src="assets/socialzen-logo.svg" alt="SocialZen by Alex Seidler">
    <div><h1>SocialZen</h1><div class="byline">by Alex Seidler</div></div>
  </div>
  <p>Soft-hide political and high-drama posts while you browse Facebook. Nothing is deleted.</p>
  <label class="toggle" for="enabled">Filtering on <input id="enabled" type="checkbox"></label>
  <div id="status" class="status" role="status"></div>
  <p>Edit the blocked and override word lists in <strong>keywords.js</strong>. Built with a tiny smile by <a href="https://rgcdata.com" target="_blank">rgcdata.com</a>.</p>
  <script src="popup.js"></script>
</body>
</html>
